<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Webhook Receiver | Real-time Stream</title>
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #020617;
            --accent-color: #38bdf8;
            --card-bg: rgba(30, 41, 59, 0.4);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 4rem 1rem;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        .header {
            text-align: center;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 2.75rem;
            letter-spacing: -0.02em;
            margin-bottom: 0.75rem;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 0 rgba(34, 197, 94, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(34, 197, 94, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
            }
        }

        #events {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .event-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.25rem 1.5rem;
            backdrop-filter: blur(8px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: slideIn 0.5s ease-out forwards;
            font-size: 0.95rem;
            position: relative;
            overflow: hidden;
        }

        .event-card:hover {
            border-color: rgba(56, 189, 248, 0.3);
            background: rgba(30, 41, 59, 0.6);
            transform: translateY(-2px);
        }

        .event-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 3px;
            background: var(--accent-color);
            opacity: 0.6;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 4rem 2rem;
            border: 1px dashed var(--border-color);
            border-radius: 1rem;
            font-style: italic;
            background: rgba(255, 255, 255, 0.01);
        }

        /* Responsive scaling */
        @media (max-width: 640px) {
            h1 {
                font-size: 2rem;
            }

            body {
                padding: 2rem 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="status-header">
                <span class="live-dot"></span>
                <span>Live Feed</span>
            </div>
            <h1>Webhook Receiver</h1>
        </header>

        <main id="events">
            <div class="empty-state">
                Checking for repository activity...
            </div>
        </main>
    </div>

    <script>
        async function fetchEvents() {
            try {
                const response = await fetch('/events');
                const data = await response.json();
                const container = document.getElementById('events');

                if (!data || data.length === 0) {
                    if (container.querySelector('.empty-state')) return;
                    container.innerHTML = '<div class="empty-state">No repository activity detected. Waiting...</div>';
                    return;
                }

                container.innerHTML = data.map(msg => `
                    <div class="event-card">
                        ${msg}
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error fetching events:', error);
            }
        }

        // Initial fetch
        fetchEvents();

        // Poll every 15 seconds (15000ms)
        setInterval(fetchEvents, 15000);
    </script>
</body>

</html>
